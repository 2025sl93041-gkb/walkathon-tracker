name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issue_comment' &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) ||
      github.event_name == 'pull_request_target'
    steps:
      - uses: cla-assistant/github-action@v2.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required: create a Personal Access Token (classic, repo scope) and add as repo secret PERSONAL_ACCESS_TOKEN
          # Settings → Secrets and variables → Actions → New repository secret
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/2025sl93041-gkb/walkathon-tracker/blob/main/CLA.md
          branch: main
          allowlist: 2025sl93041-gkb
          create-file-commit-message: "chore: store CLA signatures"
          signed-commit-message: "chore: $contributorName has signed the CLA"
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before this PR can be merged, please sign the **Contributor License Agreement** by reading [CLA.md](https://github.com/2025sl93041-gkb/walkathon-tracker/blob/main/CLA.md) and then commenting:

            > I have read the CLA Document and I hereby sign the CLA
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
